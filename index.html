function applyDesignTokens(tokens) {
  const root = document.documentElement;
  const map = {
    "--color-bg": tokens.colors.bg,
    "--color-surface": tokens.colors.surface,
    "--color-surface-soft": tokens.colors.surfaceSoft,
    "--color-text": tokens.colors.text,
    "--color-muted": tokens.colors.muted,
    "--color-subtle": tokens.colors.subtle,
    "--color-border": tokens.colors.border,
    "--color-accent": tokens.colors.accent,
    "--color-accent-strong": tokens.colors.accentStrong,
    "--color-accent-soft": tokens.colors.accentSoft,
    "--color-warning": tokens.colors.warning,
    "--color-warning-soft": tokens.colors.warningSoft,
    "--color-positive": tokens.colors.positive,
    "--color-positive-soft": tokens.colors.positiveSoft
  };
  Object.entries(map).forEach(([key, value]) => root.style.setProperty(key, value));
  root.style.setProperty("--font-body", tokens.typography.body);
  root.style.setProperty("--font-display", tokens.typography.display);
  root.style.setProperty("--font-mono", tokens.typography.mono);
}

function clamp(value, min = 0, max = 100) {
  return Math.max(min, Math.min(max, value));
}

function getOption(axis, id) {
  return axis.options.find((option) => option.id === id) || axis.options[0];
}

function computeDiagnosticOutcome(model, selections) {
  const base = Object.fromEntries(model.outcomeMetrics.map((metric) => [metric.id, 50]));
  if (base.burden !== undefined) base.burden = 45;
  model.axes.forEach((axis) => {
    const option = getOption(axis, selections[axis.id]);
    Object.entries(option.scores).forEach(([metric, delta]) => {
      base[metric] = clamp(base[metric] + delta);
    });
  });

  const readyToScale = base.trust >= 60 && base.adaptability >= 58 && base.audit >= 58 && base.burden <= 62;
  const learnable = base.trust >= 45 && base.audit >= 42 && base.burden <= 76;
  const verdict = readyToScale
    ? "Package after validation"
    : learnable
      ? "Run a contained learning loop"
      : "Do not scale yet";
  const explanation = readyToScale
    ? "The selected model has enough trust, auditability, and adaptability to justify deeper validation before a roadmap commitment."
    : learnable
      ? "The pattern is useful enough to test, but the team should reduce the highest-risk handoff before scaling it."
      : "The signal says to simplify the model, improve the system maturity, or reduce risk before building a polished customer-facing answer.";

  return { metrics: base, verdict, explanation };
}

  const tone = good ? "var(--color-positive)" : "var(--color-warning)";
  return (
    <div className="flat-card p-5">
      <div className="flex items-baseline justify-between gap-4 mb-3">
        <div className="font-semibold">{label}</div>
        <div className="mono text-sm" style={{ color: tone }}>{numeric}</div>
      </div>
      <div className="h-2 rounded-full overflow-hidden" style={{ background: "var(--color-surface-soft)" }}>
        <div className="metric-fill h-full" style={{ width: `${numeric}%`, background: tone }} />
      </div>
      {note && <p className="text-sm muted leading-relaxed mt-3">{note}</p>}
    </div>
  );
};
