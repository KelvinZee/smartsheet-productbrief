function applyDesignTokens(tokens) {
  const root = document.documentElement;
  const map = {
    "--color-bg": tokens.colors.bg,
    "--color-surface": tokens.colors.surface,
    "--color-surface-soft": tokens.colors.surfaceSoft,
    "--color-text": tokens.colors.text,
    "--color-muted": tokens.colors.muted,
    "--color-subtle": tokens.colors.subtle,
    "--color-border": tokens.colors.border,
    "--color-accent": tokens.colors.accent,
    "--color-accent-strong": tokens.colors.accentStrong,
    "--color-accent-soft": tokens.colors.accentSoft,
    "--color-warning": tokens.colors.warning,
    "--color-warning-soft": tokens.colors.warningSoft,
    "--color-positive": tokens.colors.positive,
    "--color-positive-soft": tokens.colors.positiveSoft
  };
  Object.entries(map).forEach(([key, value]) => root.style.setProperty(key, value));
  root.style.setProperty("--font-body", tokens.typography.body);
  root.style.setProperty("--font-display", tokens.typography.display);
  root.style.setProperty("--font-mono", tokens.typography.mono);
}

function clamp(value, min = 0, max = 100) {
  return Math.max(min, Math.min(max, value));
}

function getOption(axis, id) {
  return axis.options.find((option) => option.id === id) || axis.options[0];
}

function computeDiagnosticOutcome(model, selections) {
  const base = { trust: 52, revenue: 48, complexity: 48, confidence: 46 };
  model.axes.forEach((axis) => {
    const option = getOption(axis, selections[axis.id]);
    Object.entries(option.scores).forEach(([metric, delta]) => {
      base[metric] = clamp(base[metric] + delta);
    });
  });

  const readyToScale = base.trust >= 60 && base.confidence >= 58 && base.complexity <= 55;
  const learnable = base.confidence >= 45 && base.complexity <= 70;
  const verdict = readyToScale
    ? "Package after validation"
    : learnable
      ? "Run a contained learning loop"
      : "Do not scale yet";
  const explanation = readyToScale
    ? "The pattern looks promising, but the memo posture still requires validation before commitment."
    : learnable
      ? "The pattern is useful enough to test, but the operating burden or trust work still matters."
      : "The signal says to reduce risk before building a polished customer-facing answer.";

  return { metrics: base, verdict, explanation };
}

      <div className="soft-card p-5 mb-8">

        <p className="text-sm leading-relaxed muted">{INTERACTIVE_MODEL.caveat}</p>
      </div>

      <div className="grid lg:grid-cols-[0.9fr_1.1fr] gap-8">
        <div className="space-y-5">
          {INTERACTIVE_MODEL.axes.map((axis) => (
            <Card key={axis.id}>
              <Eyebrow className="mb-4">{axis.label}</Eyebrow>
              <div className="grid gap-3">
                {axis.options.map((option) => (
                  <button
                    key={option.id}
                    type="button"
                    onClick={() => updateSelection(axis.id, option.id)}
                    aria-pressed={selections[axis.id] === option.id}
                    className="focus-ring text-left flat-card p-4"
                    style={{ borderColor: selections[axis.id] === option.id ? "var(--color-accent)" : "var(--color-border)", background: selections[axis.id] === option.id ? "var(--color-accent-soft)" : "var(--color-surface)" }}
                  >
                    <div className="font-semibold mb-1">{option.label}</div>
                    <p className="text-sm muted leading-relaxed">{option.description}</p>
                  </button>
                ))}
              </div>
            </Card>
          ))}
        </div>

        <Card>
          <Eyebrow className="mb-4">Diagnostic outcome</Eyebrow>
          <h3 className="serif text-3xl mb-3">{outcome.verdict}</h3>
          <p className="muted leading-relaxed mb-6">{outcome.explanation}</p>
          <div className="grid sm:grid-cols-2 gap-4 mb-8">
            {INTERACTIVE_MODEL.outcomeMetrics.map((metric) => (
              <MetricBar key={metric.id} label={metric.label} value={outcome.metrics[metric.id]} highGood={metric.highGood} />
            ))}
          </div>
          <div className="flat-card p-5">
            <Eyebrow className="mb-4">Required differentiation tests</Eyebrow>
            <div className="space-y-4">
              {INTERACTIVE_MODEL.testCombinations.map((combo) => (
                <div key={combo.name} className="text-sm leading-relaxed">
                  <div className="font-semibold">{combo.name}</div>
                  <p className="muted">{combo.expectedPattern}</p>
                </div>
              ))}
            </div>
          </div>
        </Card>
      </div>
    </SectionShell>
  );
};

    <div className="grid md:grid-cols-2 gap-4">

          <div className="space-y-4 text-sm leading-relaxed muted">

        </Card>

    </div>
    <div className="soft-card p-5">
      <Eyebrow className="mb-2">What I would not do</Eyebrow>
      <p className="text-sm muted leading-relaxed">TK_VALIDATION_NOT_DO. This keeps the memo humble on prescription and high-confidence only where the evidence supports it.</p>

  </SectionShell>

      {OPEN_QUESTION_GROUPS.map((group) => (
        <Card key={group.group}>

        </Card>
      ))}
    </div>
  </SectionShell>
);
